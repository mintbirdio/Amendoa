name: Amendoa Scout

# Polls the watched X List, scores tweets, and pushes high-value reply alerts
# to your phone. Runs on a schedule; the dedup state is carried between runs via
# the Actions cache so a tweet is never alerted twice.
#
# Required repo secrets:  SCRAPER_API_KEY, PUSHOVER_TOKEN, PUSHOVER_USER
# Required repo variable:  WATCH_LIST_ID  (an X List id; or set WATCH_USER_ID)
# Optional variables:      MIN_SCORE, FRESHNESS_MINUTES, MAX_ALERTS_PER_RUN,
#                          DEDUP_RETENTION_DAYS, SCRAPER_BASE_URL

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:         # allow manual runs for testing

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Scout deps
        working-directory: scout
        run: npm ci

      - name: Restore dedup state
        uses: actions/cache@v4
        with:
          path: scout/.scout-state
          key: scout-state-${{ github.run_id }}
          restore-keys: |
            scout-state-

      - name: Run Scout
        working-directory: scout
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPER_BASE_URL: ${{ vars.SCRAPER_BASE_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          WATCH_LIST_ID: ${{ vars.WATCH_LIST_ID }}
          WATCH_USER_ID: ${{ vars.WATCH_USER_ID }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          FRESHNESS_MINUTES: ${{ vars.FRESHNESS_MINUTES }}
          MAX_ALERTS_PER_RUN: ${{ vars.MAX_ALERTS_PER_RUN }}
          DEDUP_RETENTION_DAYS: ${{ vars.DEDUP_RETENTION_DAYS }}
        run: npm start
